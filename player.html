<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>yt-player</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #p { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="p"></div>
<script>
/* ============================================================================
 * Suichan Bookmarker 用 埋め込みプレイヤー（中継ホスト）
 *   親（youtube.com 上のユーザースクリプト）から postMessage で制御し、
 *   状態（再生位置など）を親へ postMessage で送り返す。
 *
 * クエリ:  ?v=<videoId>&t=<秒(小数可)>&mute=1&vq=<画質>
 *   vq: 固定画質。YouTube品質文字列 small=240/medium=360/large=480/hd720/hd1080/highres。
 *       例 vq=large で 480p に固定（未指定なら従来どおり auto）。YouTube は setPlaybackQuality を
 *       auto 任せで無視/巻き戻すことがあるため、onReady＋onPlaybackQualityChange で再適用してピン留めする
 *       （ベストエフォート。プレイヤーが小さい等で希望解像度を配信しない場合は最も近い下位へフォールバック）。
 *
 * 受信メッセージ（親 → このページ）:
 *   { type:'yt-bm-toggle' }              再生/一時停止トグル（DECKミニプレイヤー用・従来）
 *   { type:'yt-bm-seek',  t:<秒> }       絶対シーク（★小数秒対応。同期はこれを多用）
 *   { type:'yt-bm-nudge', delta:<秒> }   相対シーク（DECK用・従来。±5等。小数可）
 *   { type:'yt-bm-play' }                明示再生        （★同期用・新規）
 *   { type:'yt-bm-pause' }               明示一時停止    （★同期用・新規）
 *   { type:'yt-bm-rate',  rate:<倍率> }  再生速度        （★同期用・新規。離散値）
 *   { type:'yt-bm-mute',  on:<bool> }    ミュート/解除   （★同期用・新規）
 *
 * 送信メッセージ（このページ → 親）: 250ms ごと＋状態変化時
 *   { type:'yt-bm-state', t, paused, buffering, duration, rate }
 *     ※非機微情報なので targetOrigin は '*'。安全境界は親側の origin/source 検証で担保。
 * ========================================================================== */
(function () {
  var q     = new URLSearchParams(location.search);
  var VIDEO = q.get('v') || '';
  var START = parseFloat(q.get('t')); if (!isFinite(START) || START < 0) START = 0;
  var MUTED = q.get('mute') === '1';
  var VQ    = q.get('vq') || '';   // 固定画質（例 'large'=480p）。空なら固定しない（auto）。

  var player = null;
  var ready  = false;

  // 画質ロック用: 望む品質と利用可能レベルの突き合わせ。YouTubeの品質文字列は低→高でこの順。
  var Q_ORDER = ['tiny','small','medium','large','hd720','hd1080','hd1440','hd2160','highres'];

  // VQ に最も近い“それ以下で最高”の利用可能レベルを返す（利用可能が取れない/含むならVQそのまま）。
  function pickQuality() {
    if (!VQ) return '';
    var avail = [];
    try { avail = player.getAvailableQualityLevels() || []; } catch (_) {}
    if (!avail.length || avail.indexOf(VQ) !== -1) return VQ;
    var wi = Q_ORDER.indexOf(VQ), best = '';
    for (var i = 0; i < avail.length; i++) {
      var ai = Q_ORDER.indexOf(avail[i]);
      if (ai !== -1 && ai <= wi && (best === '' || ai > Q_ORDER.indexOf(best))) best = avail[i];
    }
    return best || VQ;
  }

  // 画質を VQ に固定。YouTube は auto に戻しがちなので onReady / onPlaybackQualityChange / 再生開始時に再適用。
  //   既に目標と同じなら何もしない＝setPlaybackQuality→onPlaybackQualityChange の無限ループを防ぐ。
  function applyQuality() {
    if (!VQ || !player || !player.setPlaybackQuality) return;
    try {
      var want = pickQuality();
      if (!want) return;
      if (player.getPlaybackQuality && player.getPlaybackQuality() === want) return;
      player.setPlaybackQuality(want);
    } catch (_) {}
  }

  // YouTube IFrame Player API をロード
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);

  // API 準備完了 → プレイヤー生成
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('p', {
      width: '100%',
      height: '100%',
      videoId: VIDEO,
      // ★152-4（不正な埋め込み元）回避: nocookie ホストから読む。
      host: 'https://www.youtube-nocookie.com',
      playerVars: {
        autoplay: 1,
        start: Math.floor(START),
        playsinline: 1,
        rel: 0,
        modestbranding: 1,
        controls: 1
      },
      events: {
        onReady: function (e) {
          ready = true;
          if (MUTED) { try { e.target.mute(); } catch (_) {} }
          // 小数秒の頭出しは playerVars.start（整数）では足りないので seekTo で補正。
          if (START > 0) { try { e.target.seekTo(START, true); } catch (_) {} }
          applyQuality();   // 画質を VQ に固定（auto回避）
          postState();
        },
        onStateChange: function () { applyQuality(); postState(); },
        // YouTube が画質を auto で変えたら VQ に戻し直してピン留め（ベストエフォート）。
        onPlaybackQualityChange: function () { applyQuality(); }
      }
    });
  };

  // 親へ現在状態を送る
  function postState() {
    if (!player || !ready || !player.getPlayerState) return;
    try {
      var st = player.getPlayerState(); // -1:未開始 0:終了 1:再生 2:停止 3:バッファ 5:cued
      parent.postMessage({
        type: 'yt-bm-state',
        t: player.getCurrentTime(),
        paused: (st !== YT.PlayerState.PLAYING),
        buffering: (st === YT.PlayerState.BUFFERING),
        duration: player.getDuration(),
        rate: player.getPlaybackRate()
      }, '*');
    } catch (_) {}
  }
  setInterval(postState, 250);

  // 親からの制御を受ける
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || !d.type || !player || !ready) return;
    try {
      switch (d.type) {
        case 'yt-bm-play':
          player.playVideo();
          break;
        case 'yt-bm-pause':
          player.pauseVideo();
          break;
        case 'yt-bm-toggle':
          if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
          else player.playVideo();
          break;
        case 'yt-bm-seek':
          player.seekTo(Number(d.t) || 0, true);   // ★floor しない（小数秒のまま）
          break;
        case 'yt-bm-nudge':
          player.seekTo(player.getCurrentTime() + (Number(d.delta) || 0), true);
          break;
        case 'yt-bm-rate':
          player.setPlaybackRate(Number(d.rate) || 1);
          break;
        case 'yt-bm-mute':
          if (d.on) player.mute(); else player.unMute();
          break;
      }
    } catch (_) {}
  });
})();
</script>
</body>
</html>
